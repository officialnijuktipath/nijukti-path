<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NIJUKTI PATH - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#f5f7fa;
  color:#172033;
}

.header{
  background:linear-gradient(135deg,#063b63,#087ea4);
  color:white;
  padding:18px 6%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo{
  width:42px;
  height:42px;
  border:2px solid #f5c542;
  border-radius:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:bold;
  color:#f5c542;
  font-size:18px;
}

.brand h2{
  margin:0;
  font-size:20px;
}

.brand small{
  display:block;
  font-size:9px;
  opacity:.9;
  letter-spacing:.5px;
}

.container{
  width:92%;
  max-width:1100px;
  margin:30px auto;
}

h1{
  margin-bottom:5px;
}

.subtitle{
  color:#6b7280;
  margin-top:0;
}

.blogger-box{
  background:white;
  border-radius:14px;
  padding:22px;
  margin:25px 0;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
  border-left:5px solid #087ea4;
}

.blogger-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:20px;
}

.blogger-title{
  font-size:20px;
  font-weight:bold;
}

.status{
  margin-top:6px;
  color:#777;
}

.connect-btn{
  border:0;
  background:#4285f4;
  color:white;
  padding:13px 22px;
  border-radius:8px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.connect-btn:hover{
  opacity:.9;
}

.disconnect-btn{
  display:none;
  border:0;
  background:#dc3545;
  color:white;
  padding:10px 18px;
  border-radius:8px;
  cursor:pointer;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
  margin:25px 0;
}

.card{
  background:white;
  padding:22px;
  border-radius:12px;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}

.card h3{
  margin:0 0 15px;
  font-size:15px;
}

.count{
  color:#d19a00;
  font-size:26px;
  font-weight:bold;
}

.form-box{
  background:white;
  padding:25px;
  border-radius:14px;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.form-group{
  margin-bottom:18px;
}

label{
  display:block;
  font-weight:bold;
  margin-bottom:7px;
}

input,select,textarea{
  width:100%;
  border:1px solid #ddd;
  border-radius:7px;
  padding:12px;
  font-size:14px;
}

textarea{
  min-height:140px;
  resize:vertical;
}

.add-btn{
  background:#d89b18;
  color:white;
  border:0;
  padding:13px 24px;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
}

.message{
  margin-top:15px;
  padding:12px;
  border-radius:7px;
  display:none;
}

.success{
  background:#e8f7ed;
  color:#177245;
}

.error{
  background:#fdecec;
  color:#b42318;
}

.recent{
  background:white;
  margin-top:25px;
  padding:25px;
  border-radius:14px;
}

@media(max-width:700px){
  .cards{
    grid-template-columns:1fr;
  }

  .blogger-top{
    flex-direction:column;
    align-items:flex-start;
  }

  .header{
    padding:15px 4%;
  }
}
</style>
</head>

<body>

<header class="header">

  <div class="brand">

    <div class="logo">NP</div>

    <div>
      <h2>NIJUKTI PATH</h2>
      <small>SARKARI NAUKRI • SARKARI BHAROSA</small>
    </div>

  </div>

</header>


<main class="container">

<h1>Admin Panel</h1>

<p class="subtitle">
Manage NIJUKTI PATH website updates
</p>


<!-- BLOGGER CONNECTION -->

<section class="blogger-box">

  <div class="blogger-top">

    <div>

      <div class="blogger-title">
        📝 Blogger Connection
      </div>

      <div id="bloggerStatus" class="status">
        Blogger is not connected
      </div>

    </div>


    <div>

      <button
        id="connectBtn"
        class="connect-btn"
        onclick="connectBlogger()">
        🔗 CONNECT BLOGGER
      </button>

      <button
        id="disconnectBtn"
        class="disconnect-btn"
        onclick="disconnectBlogger()">
        Disconnect
      </button>

    </div>

  </div>

</section>


<!-- DASHBOARD CARDS -->

<section class="cards">

  <div class="card">
    <h3>Government Jobs</h3>
    <div class="count" id="governmentCount">0</div>
  </div>

  <div class="card">
    <h3>Odisha Jobs</h3>
    <div class="count" id="odishaCount">0</div>
  </div>

  <div class="card">
    <h3>Answer Keys</h3>
    <div class="count" id="answerCount">0</div>
  </div>

  <div class="card">
    <h3>Admit Cards</h3>
    <div class="count" id="admitCount">0</div>
  </div>

  <div class="card">
    <h3>Results</h3>
    <div class="count" id="resultCount">0</div>
  </div>

  <div class="card">
    <h3>Education</h3>
    <div class="count" id="educationCount">0</div>
  </div>

</section>


<!-- ADD POST -->

<section class="form-box">

<h2>Add New Post</h2>


<div class="form-group">

<label for="postTitle">
Post Title
</label>

<input
  id="postTitle"
  type="text"
  placeholder="Enter job/post title">

</div>


<div class="form-group">

<label for="category">
Category
</label>

<select id="category">

<option value="Government Jobs">
Government Jobs
</option>

<option value="Odisha Jobs">
Odisha Jobs
</option>

<option value="Answer Key">
Answer Key
</option>

<option value="Admit Card">
Admit Card
</option>

<option value="Results">
Results
</option>

<option value="Education">
Education
</option>

</select>

</div>


<div class="form-group">

<label for="description">
Description
</label>

<textarea
  id="description"
  placeholder="Enter post description"></textarea>

</div>


<div class="form-group">

<label for="officialLink">
Official Link
</label>

<input
  id="officialLink"
  type="url"
  placeholder="https://">

</div>


<button
  class="add-btn"
  onclick="addPost()">

ADD POST

</button>


<div id="message" class="message"></div>

</section>


<section class="recent">

<h2>Recent Posts</h2>

<div id="recentPosts">

<p>No posts added yet</p>

</div>

</section>

</main>


<script>

/* ==========================================
   BLOGGER CONNECT
========================================== */

function connectBlogger(){

  window.location.href =
    "/api/auth/login";

}


/* ==========================================
   CHECK BLOGGER CONNECTION
========================================== */

async function checkBlogger(){

  try{

    const response =
      await fetch("/api/auth/status");

    if(!response.ok){
      throw new Error("Status unavailable");
    }

    const data =
      await response.json();

    if(data.connected){

      document.getElementById("bloggerStatus")
        .textContent =
        "🟢 Blogger Connected";

      document.getElementById("connectBtn")
        .style.display="none";

      document.getElementById("disconnectBtn")
        .style.display="inline-block";

    }

  }catch(error){

    console.log(
      "Blogger status check:",
      error
    );

  }

}


/* ==========================================
   DISCONNECT
========================================== */

function disconnectBlogger(){

  document.cookie =
    "BLOGGER_REFRESH_TOKEN=; Max-Age=0; path=/";

  document.getElementById("bloggerStatus")
    .textContent =
    "Blogger is not connected";

  document.getElementById("connectBtn")
    .style.display="inline-block";

  document.getElementById("disconnectBtn")
    .style.display="none";

}


/* ==========================================
   ADD POST
========================================== */

async function addPost(){

  const title =
    document.getElementById("postTitle")
      .value.trim();

  const category =
    document.getElementById("category")
      .value;

  const description =
    document.getElementById("description")
      .value.trim();

  const officialLink =
    document.getElementById("officialLink")
      .value.trim();

  const message =
    document.getElementById("message");


  if(!title){

    showMessage(
      "Please enter post title.",
      true
    );

    return;

  }


  if(!description){

    showMessage(
      "Please enter description.",
      true
    );

    return;

  }


  if(!officialLink){

    showMessage(
      "Please enter official link.",
      true
    );

    return;

  }


  try{

    const response =
      await fetch("/api/posts",{

        method:"POST",

        headers:{
          "Content-Type":
            "application/json"
        },

        body:JSON.stringify({

          title:title,

          category:category,

          description:description,

          officialLink:officialLink

        })

      });


    const data =
      await response.json();


    if(!response.ok){

      throw new Error(
        data.error ||
        "Failed to add post"
      );

    }


    showMessage(
      "✅ Post added successfully!",
      false
    );


    document.getElementById("postTitle")
      .value="";

    document.getElementById("description")
      .value="";

    document.getElementById("officialLink")
      .value="";


    loadPosts();


  }catch(error){

    showMessage(
      "❌ "+error.message,
      true
    );

  }

}


/* ==========================================
   MESSAGE
========================================== */

function showMessage(text,error){

  const box =
    document.getElementById("message");

  box.style.display="block";

  box.textContent=text;

  box.className =
    "message " +
    (error ? "error" : "success");

}


/* ==========================================
   LOAD POSTS
========================================== */

async function loadPosts(){

  try{

    const response =
      await fetch("/api/posts");

    if(!response.ok) return;

    const posts =
      await response.json();

    if(!Array.isArray(posts))
      return;


    document.getElementById("recentPosts")
      .innerHTML =
      posts.length
      ? posts.map(post => `

        <div style="
          padding:12px 0;
          border-bottom:1px solid #eee;
        ">

          <strong>
            ${escapeHtml(post.title || "")}
          </strong>

          <div style="
            font-size:13px;
            color:#777;
            margin-top:4px;
          ">

            ${escapeHtml(post.category || "")}

          </div>

        </div>

      `).join("")
      : "<p>No posts added yet</p>";


  }catch(error){

    console.log(error);

  }

}


/* ==========================================
   SAFE HTML
========================================== */

function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent=text;

  return div.innerHTML;

}


/* ==========================================
   START
========================================== */

checkBlogger();

loadPosts();

</script>

</body>
</html>
