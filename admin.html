<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NIJUKTI PATH - Admin Panel</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial, sans-serif;
  background:#f4f7fb;
  color:#17213a;
}

.header{
  background:#071a38;
  color:white;
  padding:18px 25px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
}

.logo-box{
  width:48px;
  height:48px;
  border:2px solid #eab308;
  border-radius:10px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:20px;
  font-weight:bold;
  color:#eab308;
}

.logo h1{
  font-size:21px;
}

.logo p{
  font-size:10px;
  color:#aeb9cc;
  margin-top:3px;
}

.container{
  max-width:1100px;
  margin:30px auto;
  padding:0 18px;
}

.title{
  margin-bottom:25px;
}

.title h2{
  font-size:28px;
  margin-bottom:7px;
}

.title p{
  color:#68748a;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-bottom:25px;
}

.card{
  background:white;
  border:1px solid #e2e7ef;
  border-radius:14px;
  padding:20px;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.card h3{
  font-size:16px;
  margin-bottom:10px;
}

.number{
  font-size:30px;
  font-weight:bold;
  color:#eab308;
}

.form-card{
  background:white;
  border-radius:15px;
  padding:25px;
  border:1px solid #e2e7ef;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}

.form-card h2{
  margin-bottom:20px;
}

label{
  display:block;
  font-weight:bold;
  margin:15px 0 7px;
}

input,
textarea,
select{
  width:100%;
  padding:13px;
  border:1px solid #d6dce6;
  border-radius:9px;
  font-size:15px;
  outline:none;
}

textarea{
  min-height:120px;
  resize:vertical;
}

input:focus,
textarea:focus,
select:focus{
  border-color:#eab308;
}

button{
  border:0;
  border-radius:9px;
  padding:13px 22px;
  font-weight:bold;
  cursor:pointer;
}

.btn{
  background:#eab308;
  color:#071a38;
  margin-top:20px;
}

.btn:hover{
  opacity:.9;
}

.posts{
  margin-top:25px;
}

.post{
  background:white;
  border:1px solid #e2e7ef;
  border-radius:12px;
  padding:17px;
  margin-bottom:12px;
}

.post strong{
  display:block;
  margin-bottom:6px;
}

.badge{
  display:inline-block;
  background:#e8f0ff;
  color:#2563eb;
  padding:5px 9px;
  border-radius:6px;
  font-size:12px;
  font-weight:bold;
}

@media(max-width:800px){
  .grid{
    grid-template-columns:1fr 1fr;
  }
}

@media(max-width:550px){
  .header{
    padding:15px;
  }

  .grid{
    grid-template-columns:1fr;
  }

  .title h2{
    font-size:23px;
  }

  .container{
    margin-top:20px;
  }
}
</style>
</head>

<body>

<header class="header">
  <div class="logo">
    <div class="logo-box">NP</div>
    <div>
      <h1>NIJUKTI PATH</h1>
      <p>SARKARI NAUKRI, SARKARI BHAROSA</p>
    </div>
  </div>
</header>

<main class="container">

  <div class="title">
    <h2>Admin Panel</h2>
    <p>Manage NIJUKTI PATH website updates</p>
  </div>

  <div class="grid">

    <div class="card">
      <h3>Government Jobs</h3>
      <div class="number">0</div>
    </div>

    <div class="card">
      <h3>Odisha Jobs</h3>
      <div class="number">0</div>
    </div>

    <div class="card">
      <h3>Answer Keys</h3>
      <div class="number">0</div>
    </div>

    <div class="card">
      <h3>Admit Cards</h3>
      <div class="number">0</div>
    </div>

    <div class="card">
      <h3>Results</h3>
      <div class="number">0</div>
    </div>

    <div class="card">
      <h3>Education</h3>
      <div class="number">0</div>
    </div>

  </div>

  <div class="form-card">

    <h2>Add New Post</h2>

    <label>Post Title</label>
    <input type="text" placeholder="Enter job/post title">

    <label>Category</label>
    <select>
      <option>Government Jobs</option>
      <option>Odisha Jobs</option>
      <option>Answer Key</option>
      <option>Admit Card</option>
      <option>Results</option>
      <option>Education</option>
    </select>

    <label>Description</label>
    <textarea placeholder="Enter post description"></textarea>

    <label>Official Link</label>
    <input type="url" placeholder="https://">

    <button class="btn" onclick="addPost()">ADD POST</button>

  </div>

  <div class="posts">
    <div class="form-card">
      <h2>Recent Posts</h2>

      <div class="post">
        <span class="badge">ANSWER KEY</span>
        <strong>No posts added yet</strong>
        <small>Your added posts will appear here.</small>
      </div>

    </div>
  </div>

</main>

<script>
function addPost(){
  alert("Post form ready. Blogger connection will be added in the next step.");
}
</script>

</body>
  </html>
